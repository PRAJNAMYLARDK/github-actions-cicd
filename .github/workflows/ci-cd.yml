name: CI-CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  CI:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t my-webapp:latest .

      - name: Check Docker Image
        run: |
          docker images

      - name: Run Docker Container
        run: |
          docker run -d --name my-webapp-container -p 8080:80 my-webapp:latest

      - name: Wait for Application
        run: |
          sleep 5

      - name: Test Application
        run: |
          curl -f http://localhost:8080

      - name: Stop Container
        if: always()
        run: |
          docker stop my-webapp-container || true
          docker rm my-webapp-container || true

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag Docker Image
        run: |
          docker tag my-webapp:latest ${{ secrets.DOCKER_USERNAME }}/my-webapp:latest

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/my-webapp:latest
