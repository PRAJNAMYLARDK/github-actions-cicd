name: CI-CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  CI:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Build Docker image
      - name: Build Docker Image
        run: |
          docker build -t my-webapp:latest .

      # 4. Check Docker image
      - name: Check Docker Image
        run: |
          docker images

      # 5. Run container
      - name: Run Docker Container
        run: |
          docker run -d --name my-webapp-container -p 8080:80 my-webapp:latest

      # 6. Wait for container
      - name: Wait for Application
        run: |
          sleep 5

      # 7. Test application
      - name: Test Application
        run: |
          curl -f http://localhost:8080

      # 8. Stop container
      - name: Stop Container
        if: always()
        run: |
          docker stop my-webapp-container || true
          docker rm my-webapp-container || true

      # 9. Login to Docker Hub
      - name: Docker Hub Login
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 10. Tag Docker image
      - name: Tag Docker Image
        if: github.event_name == 'push'
        run: |
          docker tag my-webapp:latest ${{ secrets.DOCKER_USERNAME }}/my-webapp:latest

      # 11. Push Docker image
      - name: Push Docker Image
        if: github.event_name == 'push'
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/my-webapp:latest
